# TLS termination and proxy boundary for the application container.
# Certificate renewal is intentionally deployment-owned; mount the renewed
# files under /etc/nginx/certs and reload nginx without stopping the app.
# conf.d files are loaded inside nginx's http context, so this map is valid
# here and ensures an ordinary request closes cleanly while WebSocket requests
# retain their upgrade handshake.
map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

upstream mahanaim_app {
    server app:8080;
    keepalive 32;
}

server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name _;

    ssl_certificate /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    location / {
        proxy_pass http://mahanaim_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }
}
