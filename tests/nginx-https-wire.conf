events {}

http {
  server {
    listen 18081;
    server_name public.example;

    # Keep redirect behavior at the TLS terminator boundary. The upstream
    # application never sees this request, so the wire test must inspect the
    # exact public Location target independently of the HTTPS response.
    return 301 https://public.example:18443$request_uri;
  }

  server {
    listen 18443 ssl;
    server_name public.example;

    ssl_certificate /etc/nginx/certs/server.crt;
    ssl_certificate_key /etc/nginx/certs/server.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    location / {
      # The proxy owns TLS and rewrites forwarded metadata at the trust
      # boundary. Client-supplied X-Forwarded-* values never reach upstream.
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Host $host;
      proxy_set_header X-Forwarded-Proto https;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_pass http://mahanaim-https-upstream:18080;
    }
  }
}
