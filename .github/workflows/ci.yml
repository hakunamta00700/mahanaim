name: Mahanaim CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    container: nimlang/nim:2.2.4
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: mahanaim
          POSTGRES_PASSWORD: mahanaim-ci-password
          POSTGRES_DB: mahanaim
        options: >-
          --health-cmd "pg_isready -U mahanaim -d mahanaim"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      ## The service hostname is stable inside a container job. These values
      ## are test-only credentials and are never reused by release deploys.
      MAHANAIM_POSTGRES_HOST: postgres
      MAHANAIM_POSTGRES_PORT: 5432
      MAHANAIM_POSTGRES_USER: mahanaim
      MAHANAIM_POSTGRES_PASSWORD: mahanaim-ci-password
      MAHANAIM_POSTGRES_DATABASE: mahanaim
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install PostgreSQL client runtime
        run: apt-get update && apt-get install -y --no-install-recommends libpq5

      - name: Install locked dependencies
        run: nimble install -y --depsOnly

      - name: Run contract tests
        run: nimble test

      - name: Compile verification targets
        run: nimble verify

      - name: Validate package and dependency contracts
        run: nimble check

      - name: Compile HTTPS reverse-proxy wire contract
        run: nimble httpsLiveCheck

      - name: Run HTTPS live contract or record explicit skip
        run: nimble httpsLive

      - name: Compile PostgreSQL adapter contract
        run: nimble postgresCheck

      - name: Compile PostgreSQL live contract source
        run: nimble postgresLiveCheck

      - name: Run optional PostgreSQL live contract
        run: nimble postgresLive

  cross-platform:
    name: ${{ matrix.os }} / Nim ${{ matrix.nim }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        nim: ["2.2.4"]
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install Nim (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          curl --fail --location --silent --show-error \
            "https://nim-lang.org/download/nim-${{ matrix.nim }}-linux_x64.tar.xz" \
            --output nim.tar.xz
          tar -xJf nim.tar.xz
          echo "$PWD/nim-${{ matrix.nim }}/bin" >> "$GITHUB_PATH"

      - name: Install Nim (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $archive = "nim-${{ matrix.nim }}_x64.zip"
          Invoke-WebRequest -Uri "https://nim-lang.org/download/$archive" -OutFile $archive
          Expand-Archive -Path $archive -DestinationPath . -Force
          "${{ github.workspace }}\nim-${{ matrix.nim }}\bin" | Out-File -FilePath $Env:GITHUB_PATH -Encoding utf8 -Append

      - name: Install Nimble
        uses: nim-lang/setup-nimble-action@v1
        with:
          nimble-version: latest

      - name: Install locked dependencies
        run: nimble install -y --depsOnly

      - name: Run contract tests
        run: nimble test

      - name: Compile verification targets
        run: nimble verify

      - name: Validate package and dependency contracts
        run: nimble check

      - name: Compile bcrypt password hasher contract
        run: nimble bcryptCheck

      - name: Run bcrypt password hasher contract
        run: nimble bcryptTest

      - name: Compile Beast/httpx adapter contract (Unix)
        if: runner.os != 'Windows'
        run: nimble beastCheck

      - name: Compile Beast/httpx live fixture (Unix)
        if: runner.os == 'Linux'
        run: nimble beastLiveCheck

      - name: Run Beast/httpx live fixture (Linux)
        if: runner.os == 'Linux'
        run: nimble beastLive

      - name: Build release candidate
        run: nimble build

      - name: Hash release candidate (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: sha256sum mahanaim_cli > mahanaim_cli.sha256

      - name: Hash release candidate (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $hash = (Get-FileHash .\mahanaim_cli.exe -Algorithm SHA256).Hash.ToLower()
          "$hash  mahanaim_cli.exe" | Set-Content -NoNewline mahanaim_cli.sha256

      - name: Verify release candidate checksum (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: sha256sum --check mahanaim_cli.sha256

      - name: Verify release candidate checksum (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $expected = (Get-Content .\mahanaim_cli.sha256).Split()[0]
          $actual = (Get-FileHash .\mahanaim_cli.exe -Algorithm SHA256).Hash.ToLower()
          if ($expected -ne $actual) { throw "release checksum mismatch" }

      - name: Upload release candidate and checksum
        uses: actions/upload-artifact@v4
        with:
          name: mahanaim-${{ matrix.os }}-nim-${{ matrix.nim }}
          path: |
            mahanaim_cli*
            mahanaim_cli.sha256
